        const tel = document.getElementById("telephone");

        tel.addEventListener("input", () => {
            let v = tel.value.replace(/\D/g, "");

            if (v.startsWith("33")) v = "0" + v.slice(2);

            v = v.slice(0, 10);
            v = v.replace(/(\d{2})(?=\d)/g, "$1 ");

            tel.value = v.trim();
        });
