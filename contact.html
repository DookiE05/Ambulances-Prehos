            <div class="container">
                <form  class="form" onsubmit="sendEmail(); reset(); return false">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required>
        
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required>

                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone" required>
        
                    <label for="msg">Votre demande concerne :</label>
                    <select id="msg" name="msg" required>
                        <option value="" disabled selected>Veuillez sélectionner</option>
                        <option value="ambulance">Transport en Ambulance</option>
                        <option value="vsl">Transport en Véhicule Sanitaire Léger (VSL)</option>
                        <option value="tpmr">Réclamation</option>
                        <option value="autre">Autre (Veuillez préciser votre message)</option>
                    </select>
        
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
        
                    <input type="submit" value="Envoyer">
                </form>
